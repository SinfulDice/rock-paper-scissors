[project]
name = "rps"
version = "0.1.0"
description = "Trains the rock-paper-scissors hand sign classifier"
readme = "README.md"
authors = [
    { name = "Pierre-Antoine SUT", email = "206546015+SinfulDice@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
