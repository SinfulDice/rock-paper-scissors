# GitHub Actions (R41): on every push to main, run all the tests, then put the site on GitHub Pages.
# If any test fails, the "deploy" job never starts, so a broken version can't go online.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, to deploy by hand

# What the robot is allowed to do: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write # proves to GitHub Pages that the upload comes from this repo

# If two pushes come quickly, finish the running deployment, then deploy the latest one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # downloads the repo onto the robot's machine

      # --- Python (training/) ---
      - uses: astral-sh/setup-uv@v6 # installs uv
      - name: Python tests
        working-directory: training
        run: uv run pytest # uv installs Python 3.12 (.python-version) and the packages first

      # --- Website (web/) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci # like npm install, but exactly the versions of package-lock.json
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Web tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build # → web/dist/, the finished site

      - uses: actions/upload-pages-artifact@v3 # packs web/dist/ for the deploy job
        with:
          path: web/dist

  deploy:
    needs: test-and-build # only runs if every step above passed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
